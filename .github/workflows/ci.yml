name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Linux or macOS CI
        if: runner.os != 'Windows'
        run: bash ci.sh
      - name: Run Windows CI
        if: runner.os == 'Windows'
        shell: cmd
        run: ci.bat
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: hello-app-${{ matrix.os }}
          path: target/hello.jar
